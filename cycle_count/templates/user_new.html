{% extends 'base.html' %}
{% block title %}New user{% endblock %}
{% block content %}
  <h1>New user</h1>
  <div class="card">
    <form method="post" class="stacked" autocomplete="off">
      {{ csrf_field() }}
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             value="{{ form.get('username', '') }}" autofocus
             autocapitalize="none" autocorrect="off">

      <label for="full_name">Full name</label>
      <input type="text" id="full_name" name="full_name"
             value="{{ form.get('full_name', '') }}">

      <label for="email">Email</label>
      <input type="email" id="email" name="email"
             value="{{ form.get('email', '') }}"
             autocapitalize="none" autocorrect="off">

      <label for="role">Role</label>
      <select id="role" name="role">
        <option value="">— select —</option>
        <option value="admin"         {% if form.get('role') == 'admin' %}selected{% endif %}>Admin</option>
        <option value="analyst"       {% if form.get('role') == 'analyst' %}selected{% endif %}>Analyst</option>
        <option value="priority"      {% if form.get('role') == 'priority' %}selected{% endif %}>Priority (analyst, requests highlighted)</option>
        <option value="cycle_counter" {% if form.get('role') == 'cycle_counter' %}selected{% endif %}>Cycle counter</option>
      </select>

      <label for="password">Password (≥6 characters)</label>
      <input type="password" id="password" name="password">

      <div class="btn-row">
        <button type="submit" class="btn">Create user</button>
        <a class="btn secondary" href="{{ url_for('cc.users_list') }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
